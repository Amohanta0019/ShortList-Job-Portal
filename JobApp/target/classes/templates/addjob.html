<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Add Job</title>

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
      crossorigin="anonymous"
    />

    <!-- Application CSS -->
    <link rel="stylesheet" th:href="@{/style.css}" />
    <link rel="stylesheet" th:href="@{/style1.css}" />
  </head>

  <body>
    <!-- ================= NAVBAR ================= -->

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand" th:href="@{/home}"> Job Portal </a>

        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
          aria-controls="navbarNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link" th:href="@{/home}"> Home </a>
            </li>

            <li class="nav-item">
              <a class="nav-link" th:href="@{/viewalljobs}"> All Jobs </a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="https://telusko.com/"> Contact </a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- ================= JOB FORM ================= -->

    <div class="container mt-5">
      <div class="row justify-content-center">
        <div class="col-md-8">
          <div class="card shadow">
            <div class="card-header">
              <h3 class="text-center">Post a New Job</h3>
            </div>

            <div class="card-body">
              <!--
                        Spring Boot Controller should add:

                        model.addAttribute("jobPost", new JobPost());
                    -->

              <form th:action="@{/addjob}" th:object="${jobPost}" method="post">
                <!-- Post Profile -->

                <div class="mb-3">
                  <label for="postProfile" class="form-label">
                    Post Profile
                  </label>

                  <input
                    type="text"
                    class="form-control"
                    id="postProfile"
                    th:field="*{postProfile}"
                    required
                  />
                </div>

                <!-- Post Description -->

                <div class="mb-3">
                  <label for="postDesc" class="form-label">
                    Post Description
                  </label>

                  <textarea
                    class="form-control"
                    id="postDesc"
                    th:field="*{postDesc}"
                    rows="3"
                    required
                  >
                  </textarea>
                </div>

                <!-- Required Experience -->

                <div class="mb-3">
                  <label for="reqExperience" class="form-label">
                    Required Experience
                  </label>

                  <input
                    type="number"
                    class="form-control"
                    id="reqExperience"
                    th:field="*{reqExperience}"
                    min="0"
                    required
                  />
                </div>

                <!-- Tech Stack -->

                <div class="mb-3">
                  <label for="postTechStack" class="form-label">
                    Tech Stack
                  </label>

                  <select
                    multiple
                    class="form-select"
                    id="postTechStack"
                    th:field="*{postTechStack}"
                    required
                  >
                    <option value="Java">Java</option>

                    <option value="JavaScript">JavaScript</option>

                    <option value="Swift">Swift</option>

                    <option value="TypeScript">TypeScript</option>

                    <option value="Go">Go</option>

                    <option value="Kotlin">Kotlin</option>

                    <option value="Rust">Rust</option>

                    <option value="PHP">PHP</option>

                    <option value="HTML5">HTML5</option>

                    <option value="CSS3">CSS3</option>

                    <option value="GraphQL">GraphQL</option>

                    <option value="Raspberry Pi">Raspberry Pi</option>

                    <option value="Arduino">Arduino</option>

                    <option value="IoT (Internet of Things)">
                      IoT (Internet of Things)
                    </option>

                    <option value="Apache Kafka">Apache Kafka</option>

                    <option value="Elasticsearch">Elasticsearch</option>

                    <option value="Unity">Unity</option>

                    <option value="Game Development">Game Development</option>

                    <option value="Vue.js">Vue.js</option>

                    <option value="Angular">Angular</option>

                    <option value="React Native">React Native</option>

                    <option value="Flutter">Flutter</option>

                    <option value="Node.js">Node.js</option>

                    <option value="Express.js">Express.js</option>

                    <option value="Django">Django</option>

                    <option value="Flask">Flask</option>

                    <option value="Ruby on Rails">Ruby on Rails</option>

                    <option value="Laravel">Laravel</option>

                    <option value="TensorFlow">TensorFlow</option>

                    <option value="PyTorch">PyTorch</option>

                    <option value="Kubernetes">Kubernetes</option>

                    <option value="Docker">Docker</option>

                    <option value="Jenkins">Jenkins</option>

                    <option value="AWS (Amazon Web Services)">
                      AWS (Amazon Web Services)
                    </option>

                    <option value="Azure">Azure</option>

                    <option value="Google Cloud">Google Cloud</option>

                    <option value="DevOps">DevOps</option>

                    <option value="Blockchain">Blockchain</option>

                    <option value="Machine Learning">Machine Learning</option>

                    <option value="Artificial Intelligence">
                      Artificial Intelligence
                    </option>

                    <option value="Cybersecurity">Cybersecurity</option>

                    <option value="CISSP">CISSP</option>

                    <option value="CompTIA Security+">CompTIA Security+</option>

                    <option value="Certified Ethical Hacker (CEH)">
                      Certified Ethical Hacker (CEH)
                    </option>

                    <option value="Scrum">Scrum</option>

                    <option value="Agile">Agile</option>

                    <option value="Kanban">Kanban</option>
                  </select>

                  <div class="form-text">
                    Hold Ctrl (Windows) or Command (Mac) to select multiple
                    technologies.
                  </div>
                </div>

                <!-- Submit -->

                <div class="d-grid">
                  <button type="submit" class="btn btn-primary">Submit</button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap JavaScript -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
