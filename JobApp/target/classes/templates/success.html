<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Job Post Details</title>

    <!-- Bootstrap CSS -->

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
      crossorigin="anonymous"
    />

    <!-- Custom CSS -->

    <link rel="stylesheet" th:href="@{/style.css}" />

    <style>
      .card {
        border: 2px solid #343a40;
        background-color: #f8f9fa;
        margin-bottom: 20px;
      }
    </style>
  </head>

  <body>
    <!-- Job Post Details -->

    <div class="container mt-5">
      <div class="card">
        <div class="card-body">
          <h2 class="card-title" th:text="${jobPost.postProfile}">
            Job Profile
          </h2>

          <p class="card-text">
            <strong>Description:</strong>
            <span th:text="${jobPost.postDesc}"> Job description </span>
          </p>

          <p class="card-text">
            <strong>Required Experience:</strong>
            <span th:text="${jobPost.reqExperience}"> 0 </span>
            years
          </p>

          <p class="card-text">
            <strong>Tech Stack:</strong>
          </p>

          <ul>
            <li th:each="tech : ${jobPost.postTechStack}" th:text="${tech}">
              Java
            </li>
          </ul>
        </div>
      </div>
    </div>
  </body>
</html>
