<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Job Portal</title>

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
      crossorigin="anonymous"
    />

    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/style.css}" />
    <link rel="stylesheet" th:href="@{/style1.css}" />
  </head>

  <body>
    <!-- ================= NAVBAR ================= -->

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container">
        <!-- Logo / Brand -->
        <a class="navbar-brand" th:href="@{/home}"> Job Portal </a>

        <!-- Mobile Menu Button -->
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
          aria-controls="navbarNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Navigation -->
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link" th:href="@{/home}"> Home </a>
            </li>

            <li class="nav-item">
              <a class="nav-link" th:href="@{/viewalljobs}"> All Jobs </a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="https://telusko.com/"> Contact </a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- ================= MAIN CONTENT ================= -->

    <div class="container mt-5">
      <div class="row justify-content-center">
        <!-- Card 1 -->
        <div class="col-md-6 mb-3">
          <div class="card">
            <div class="card-body text-center">
              <h5 class="card-title">View All Jobs</h5>

              <p class="card-text">Browse all available jobs.</p>

              <a th:href="@{/viewalljobs}" class="btn btn-primary">
                View Jobs
              </a>
            </div>
          </div>
        </div>

        <!-- Card 2 -->
        <div class="col-md-6 mb-3">
          <div class="card">
            <div class="card-body text-center">
              <h5 class="card-title">Add Job</h5>

              <p class="card-text">Post a new job opportunity.</p>

              <a th:href="@{/addjob}" class="btn btn-primary"> Add Job </a>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap JavaScript -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
